<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Conatus — 成長記録</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-text">
        <h1>Conatus</h1>
        <p class="subtitle">学んだこと、できるようになったことの記録</p>
      </div>
    </header>

    <section class="stats" id="stats">
      <!-- 統計カードはJSで挿入 -->
    </section>

    <section class="panel">
      <h2 class="panel-title">習得したスキル</h2>
      <div class="skills" id="skills">
        <!-- スキルバッジはJSで挿入 -->
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">学習ログ</h2>
        <div class="tag-filter" id="tag-filter">
          <!-- タグボタンはJSで挿入 -->
        </div>
      </div>
      <div class="timeline" id="timeline">
        <!-- ログはJSで挿入 -->
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
